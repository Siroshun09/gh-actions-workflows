name: Go Release
on:
  workflow_call:
    inputs:
      enable-cache:
        type: boolean
        required: false
        default: true
      goreleaser-distribution:
        type: string
        required: false
        default: "goreleaser"
      goreleaser-version:
        type: string
        required: false
        default: "latest"
      goreleaser-args:
        type: string
        required: false
        default: "release --clean"
      working-dir:
        required: false
        type: string
        default: "."
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - uses: Siroshun09/gh-actions-workflows/.github/actions/go-setup@v1
        with:
          enable-cache: ${{ inputs.enable-cache }}
          working-dir: ${{ inputs.working-dir }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: ${{ inputs.goreleaser-distribution }}
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
          workdir: ${{ inputs.working-dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

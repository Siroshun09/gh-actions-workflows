name: Publish to Maven Central Portal
run-name: Publish Siroshun09/${{ inputs.repository }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name under Siroshun09 (e.g. Codec4J)
        required: true
        type: string
      tag:
        description: Release tag to publish (must equal the project version)
        required: true
        type: string
      java-version:
        description: Java version to build with
        required: false
        type: string
        default: "25"

permissions: {}

concurrency:
  group: publish-to-maven-central-portal-${{ inputs.repository }}

env:
  REPOSITORY: Siroshun09/${{ inputs.repository }}
  TAG: ${{ inputs.tag }}

jobs:
  # Runs without secrets, so invalid input fails before the approval prompt.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check inputs
        env:
          NAME: ${{ inputs.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]] || [[ ! "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid repository or tag"
            exit 1
          fi
          if [ "$(gh api "repos/$REPOSITORY" --jq .visibility)" != "public" ]; then
            echo "::error::$REPOSITORY is not a public repository"
            exit 1
          fi
          if [ "$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .draft)" != "false" ]; then
            echo "::error::$TAG is not a published release of $REPOSITORY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPOSITORY }}
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Check version
        run: |
          chmod +x ./gradlew
          VERSION="$(./gradlew -q --no-daemon properties --property version --no-configuration-cache | sed -n 's/^version: //p')"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Project version ($VERSION) does not match the tag ($TAG)"
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Snapshot versions cannot be published"
            exit 1
          fi
          echo "Publishing $REPOSITORY $TAG ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: maven-central
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Do not share caches with a job that holds the signing key.
          cache-disabled: true
      - name: Configure signing and credentials
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_PASSWORD }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          umask 077
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          {
            echo "signing.gnupg.executable=gpg"
            echo "signing.gnupg.keyName=$KEY_ID"
            echo "signing.gnupg.passphrase=$GPG_PASSPHRASE"
            echo "mavenCentralPortal.username=$PORTAL_USERNAME"
            echo "mavenCentralPortal.password=$PORTAL_PASSWORD"
            echo "mavenCentralPortal.publishingType=AUTOMATIC"
          } >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Publish
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon uploadToMavenCentralPortal

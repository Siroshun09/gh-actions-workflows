name: Publish to Maven Central Portal (Gradle)
on:
  workflow_call:
    inputs:
      java-version: # see https://github.com/actions/setup-java#supported-version-syntax
        required: true
        type: string
      distribution: # see https://github.com/actions/setup-java#supported-distributions
        required: false
        type: string
        default: "temurin"
      working-dir:
        required: false
        type: string
        default: "."

# Requires the caller repository to have a "maven-central" environment with these secrets:
# MAVEN_CENTRAL_PORTAL_USERNAME, MAVEN_CENTRAL_PORTAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Do not share caches with a job that holds the signing key.
          cache-disabled: true
      - name: Check version
        working-directory: ${{ inputs.working-dir }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "release" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Only a published release on a tag can be published"
            exit 1
          fi
          chmod +x ./gradlew
          VERSION="$(./gradlew -q --no-daemon properties --property version --no-configuration-cache | sed -n 's/^version: //p')"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Project version ($VERSION) does not match the tag ($TAG)"
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Snapshot versions cannot be published"
            exit 1
          fi
      - name: Configure signing and credentials
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_PASSWORD }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          umask 077
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          {
            echo "signing.gnupg.executable=gpg"
            echo "signing.gnupg.keyName=$KEY_ID"
            echo "signing.gnupg.passphrase=$GPG_PASSPHRASE"
            echo "mavenCentralPortal.username=$PORTAL_USERNAME"
            echo "mavenCentralPortal.password=$PORTAL_PASSWORD"
            echo "mavenCentralPortal.publishingType=AUTOMATIC"
          } >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Publish
        working-directory: ${{ inputs.working-dir }}
        run: ./gradlew --no-daemon uploadToMavenCentralPortal

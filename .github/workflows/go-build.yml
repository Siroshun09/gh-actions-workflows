name: Go Build
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: "ubuntu-latest"
      enable-cache:
        type: boolean
        required: false
        default: true
      build-arguments:
        type: string
        required: false
        default: "build"
      go-filepath:
        type: string
        required: true
      binary-name:
        type: string
        required: false
      target-os:
        type: string
        description: |
          The target operating system for the build.
          This value will be set to GOOS environment variable.
          See https://go.dev/doc/install/source#environment
        required: false
      target-arch:
        type: string
        description: |
          The target architecture for the build.
          This value will be set to GOARCH environment variable.
          See https://go.dev/doc/install/source#environment
        required: false
      output-filepath:
        type: string
        required: false
      package-name:
        required: false
        type: string
        default: "Package"
      upload-artifacts:
        required: false
        type: boolean
        default: true
      working-dir:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: Siroshun09/gh-actions-workflows/.github/actions/checkout@v1
      - uses: Siroshun09/gh-actions-workflows/.github/actions/go-setup@v1
        with:
          enable-cache: ${{ inputs.enable-cache }}
          go-version: ${{ inputs.go-version }}
          working-dir: ${{ inputs.working-dir }}
      - name: "Generate output filepath"
        id: output-filepath
        shell: bash
        run: |
          if [ -n "${{ inputs.output-filepath }}" ]; then
            echo "value=$RUNNER_TEMP/bin/${{ inputs.output-filepath }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          OS="${{ runner.os }}"
          if [ -n "${{ inputs.target-os }}" ]; then
            OS="${{ inputs.target-os }}"
          fi

          EXT=""
          if [ "$OS" = "windows" ]; then
            EXT=".exe"
          fi

          if [ -n "${{ inputs.binary-name }}" ]; then
            echo "value=$RUNNER_TEMP/bin/${{ inputs.binary-name }}$EXT" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Either output-filepath or binary-name must be specified" >&2
            exit 1
          fi
      - uses: Siroshun09/gh-actions-workflows/.github/actions/go-build@v1
        with:
          build-arguments: ${{ inputs.build-arguments }}
          go-filepath: ${{ inputs.go-filepath }}
          target-os: ${{ inputs.target-os }}
          target-arch: ${{ inputs.target-arch }}
          output-filepath: ${{ steps.output-filepath.outputs.value }}
          working-dir: ${{ inputs.working-dir }}
      - name: "Generate artifact name"
        id: artifact-name
        if: ${{ inputs.upload-artifacts }}
        shell: bash
        run: |
          OS="${{ runner.os }}"
          ARCH="${{ runner.arch }}"
          
          if [ -n "${{ inputs.target-os }}" ]; then
            OS="${{ inputs.target-os }}"
          fi
          
          if [ -n "${{ inputs.target-arch }}" ]; then
            ARCH="${{ inputs.target-arch }}"
          fi
          
          echo "value=${{ inputs.package-name }}-${OS}-${ARCH}" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        continue-on-error: true
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: ${{ steps.output-filepath.outputs.value }}

name: Go Build
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: "ubuntu-latest"
      enable-cache:
        type: boolean
        required: false
        default: true
      build-arguments:
        type: string
        required: false
        default: "build"
      go-filepath:
        type: string
        required: true
      run-test:
        type: boolean
        required: false
        default: true
      test-arguments:
        type: string
        required: false
        default: "test -v ./..."
      output-filepath:
        type: string
        required: true
      package-name:
        required: false
        type: string
        default: "Package"
      upload-artifacts:
        required: false
        type: boolean
        default: true
      working-dir:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string  

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: "Set up Go"
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.working-dir }}/go.mod
          cache: ${{ inputs.enable-cache }}
          cache-dependency-path: |
            ${{ inputs.working-dir }}/go.sum
      - name: "Build"
        working-directory: ${{ inputs.working-dir }}
        run: |
          go ${{ inputs.build-arguments }} -o ${{ inputs.output-filepath }} ${{ inputs.go-filepath }}
      - name: "Test"
        if: ${{ inputs.run-test }}
        working-directory: ${{ inputs.working-dir }}
        run: |
          go ${{ inputs.test-arguments }}
      - name: "Upload artifacts"
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        continue-on-error: true
        with:
          name: ${{ inputs.package-name }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ inputs.working-dir }}/${{ inputs.output-filepath }}

name: Setup Go
description: Setup Go environment for building, testing, or linting

inputs:
  enable-cache:
    description: "Enable caching for Go modules"
    required: false
    default: "true"
  go-version:
    description: Go version to set up (falls back to go.mod if not specified)
    required: false
  working-dir:
    description: "Working directory"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: "Set up Go"
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.working-dir }}/go.mod
        cache: ${{ inputs.enable-cache }}
        cache-dependency-path: |
          ${{ inputs.working-dir }}/go.sum

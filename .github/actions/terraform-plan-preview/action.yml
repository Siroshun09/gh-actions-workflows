name: "Terraform Plan Preview"

inputs:
  plan-stdout:
    require: true
  plan-outcome:
    require: true

runs:
  using: "composite"
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Plan 📖\`${{ inputs.plan-outcome }}\`
          
          \`\`\`\n
          ${{ inputs.plan-stdout }}
          \`\`\`
          `;

          await core.summary.addRaw(output).write();
